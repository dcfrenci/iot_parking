openapi: 3.0.3
info:
  title: Parking App API
  version: 1.0.0
  description: API for a parking booking application

paths:

  # ─── LOGIN ───────────────────────────────────────────────────────────────────

  /login:
    get:
      summary: Login
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
        - name: pass
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
                  account_id:
                    type: string

    patch:
      summary: Update account (name, email, password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                old_pass:
                  type: string
                new_pass:
                  type: string
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
                  account_id:
                    type: string

    delete:
      summary: Delete account
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account deleted

  /register:
    post:
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, pass]
              properties:
                name:
                  type: string
                email:
                  type: string
                pass:
                  type: string
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
                  account_id:
                    type: string

  # ─── SETTINGS TAB ────────────────────────────────────────────────────────────

  /user:
    get:
      summary: Get user info
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string

  /user/plates:
    get:
      summary: Get user plates
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of plates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    plate_text:
                      type: string
                    is_active:
                      type: boolean
                    image_uri:
                      type: string
                    plate_id:
                      type: string

    post:
      summary: Create plate (Crea targa)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, name, plate_text, image_uri]
              properties:
                account_id:
                  type: string
                name:
                  type: string
                plate_text:
                  type: string
                image_uri:
                  type: string
      responses:
        '201':
          description: Plate created
          content:
            application/json:
              schema:
                type: object
                properties:
                  plate_id:
                    type: string

    delete:
      summary: Delete plate
      parameters:
        - name: plate_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plate deleted

  /user/payment:
    get:
      summary: Get payment info
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment string
          content:
            application/json:
              schema:
                type: object
                properties:
                  string:
                    type: string

    post:
      summary: Add payment method (Crea / Aggiorna)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, type, string]
              properties:
                account_id:
                  type: string
                type:
                  type: string
                string:
                  type: string
      responses:
        '201':
          description: Payment created/updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  string:
                    type: string

  /user/preferences/distance:
    get:
      summary: Get distance preference
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Distance preference value
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: number

    post:
      summary: Update distance preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, new_value]
              properties:
                account_id:
                  type: string
                new_value:
                  type: number
      responses:
        '200':
          description: Updated distance value
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: number

  /user/preferences/price:
    get:
      summary: Get price preference
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Price preference value
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: number

    post:
      summary: Update price preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, new_value]
              properties:
                account_id:
                  type: string
                new_value:
                  type: number
      responses:
        '200':
          description: Updated price value
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: number

  # ─── HOME TAB ────────────────────────────────────────────────────────────────

  /paying:
    get:
      summary: Get active/ongoing parking session
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current paying session
          content:
            application/json:
              schema:
                type: object
                properties:
                  plate_id:
                    type: string
                  car_plate:
                    type: string
                  parking_id:
                    type: string
                  parking_name:
                    type: string
                  price_per_hour:
                    type: number
                  entry_time:
                    type: string
                    format: date-time
                  amount:
                    type: number
                  is_paid:
                    type: boolean

  /parkings/all:
    get:
      summary: Get all parkings
      responses:
        '200':
          description: List of all parkings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    address:
                      type: string
                    parking_id:
                      type: string

  /parkings:
    get:
      summary: Get parking details
      parameters:
        - name: parking_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Parking details
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  address:
                    type: string
                  lat:
                    type: number
                  lon:
                    type: number
                  total_slot:
                    type: integer
                  available_slot:
                    type: integer
                  price_per_hour:
                    type: number
                  parking_id:
                    type: string

    post:
      summary: Create parking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, lat, lon, total_slot, price_per_hour]
              properties:
                name:
                  type: string
                address:
                  type: string
                lat:
                  type: number
                lon:
                  type: number
                total_slot:
                  type: integer
                price_per_hour:
                  type: number
      responses:
        '201':
          description: Parking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  address:
                    type: string
                  lat:
                    type: number
                  lon:
                    type: number
                  available_slot:
                    type: integer
                  total_slot:
                    type: integer
                  price_per_hour:
                    type: number
                  parking_id:
                    type: string

    patch:
      summary: Update parking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parking_id]
              properties:
                parking_id:
                  type: string
                address:
                  type: string
                lat:
                  type: number
                lon:
                  type: number
                total_slot:
                  type: integer
                price_per_hour:
                  type: number
      responses:
        '200':
          description: Parking updated

    delete:
      summary: Delete parking
      parameters:
        - name: parking_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Parking deleted

  /parkings/range:
    get:
      summary: Get parkings in range
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lon
          in: query
          required: true
          schema:
            type: number
      responses:
        '200':
          description: List of parkings in range
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    address:
                      type: string
                    lat:
                      type: number
                    lon:
                      type: number
                    available_slot:
                      type: integer
                    total_slot:
                      type: integer
                    price_per_hour:
                      type: number
                    parking_id:
                      type: string
                    distance:
                      type: number

  /bookings:
    get:
      summary: Get user bookings
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    booking_id:
                      type: string
                    name:
                      type: string
                    parking_id:
                      type: string
                    parking_name:
                      type: string
                    plate_id:
                      type: string
                    car_plate:
                      type: string
                    date:
                      type: string
                      format: date
                    days:
                      type: integer
                    price_per_hour:
                      type: number
                    slot_code:
                      type: string

    post:
      summary: Create booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, name, parking_id, plate_id, days]
              properties:
                account_id:
                  type: string
                name:
                  type: string
                parking_id:
                  type: string
                plate_id:
                  type: string
                days:
                  type: integer
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id:
                    type: string
                  name:
                    type: string
                  parking_id:
                    type: string
                  parking_name:
                    type: string
                  plate_id:
                    type: string
                  car_plate:
                    type: string
                  date:
                    type: string
                    format: date
                  days:
                    type: integer
                  price_per_hour:
                    type: number
                  slot_code:
                    type: string

    patch:
      summary: Update booking (plate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_id, plate_id, car_plate]
              properties:
                booking_id:
                  type: string
                plate_id:
                  type: string
                car_plate:
                  type: string
      responses:
        '200':
          description: Booking updated

    delete:
      summary: Delete booking
      parameters:
        - name: booking_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking deleted
